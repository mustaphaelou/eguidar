services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eguidar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-eguidar}
      POSTGRES_TEST_DB: ${TEST_DB_NAME:-eguidar_test}
    ports:
      # Loopback en local. Sous Coolify, POSTGRES_HOST_BIND=10.0.1.1 : le
      # conteneur de build atteint alors la base par `host.docker.internal`.
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eguidar} -d ${POSTGRES_DB:-eguidar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.52
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eguidar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eguidar}
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - ADMIN_NAME=${ADMIN_NAME:-Administrateur}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL must be set in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  # Purge la zone Cloudflare avant que le nouveau conteneur ne prenne le trafic.
  # One-shot : il sort 0 (purgé ou no-op journalisé) ou 1 (purge en échec), et
  # l'application l'attend. Il tourne sur la cible `migrate`, qui copie tout le
  # contexte : `scripts/purger-edge.mjs` y est présent sans toucher la `runner`.
  purge-edge:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    command: ["node", "scripts/purger-edge.mjs"]
    environment:
      - PURGE_EDGE=${PURGE_EDGE:-}
      - CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      # Le build lit le catalogue publié par le service `postgres`. Il reste sur
      # le réseau bridge par défaut et joint la base par le gateway de l'hôte.
      # Pas de `network: host` : Buildx 0.37.2+ refuse ce réseau si l'appelant ne
      # passe pas `--allow=network.host`, et `docker compose build` — celui que
      # Coolify exécute — n'a pas ce drapeau. `build.entitlements` ne l'accorde
      # pas : un target bake ne fait que *demander* le privilège.
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      secrets:
        - database_url
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eguidar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eguidar}
      - REDIS_URL=redis://redis:6379
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set in .env}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_BETTER_AUTH_URL=${NEXT_PUBLIC_BETTER_AUTH_URL:-http://localhost:3000}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID:-}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-Eguidar <onboarding@resend.dev>}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-eguidar}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - RETENTION_BROUILLON_IMAGE_PRODUIT_H=${RETENTION_BROUILLON_IMAGE_PRODUIT_H:-24}
      - SERVICE_FQDN_APP_3000=${SERVICE_FQDN_APP_3000:-http://localhost:3000}
      # La purge des écritures d'Administration lit les mêmes identifiants que
      # le service one-shot de déploiement : sans eux, elle se tait et le bord
      # ne serait jamais rafraîchi entre deux deploys.
      - CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      # Pas de dépendance directe à `migrate` : ce serait un chemin qui
      # contourne la purge. La migration est atteinte par `purge-edge`.
      purge-edge:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  redisdata:
  meilidata:

# Le secret n'est jamais écrit ici : sa valeur vient de l'environnement du
# processus Compose, que Coolify alimente. `DATABASE_URL_BUILD` porte une
# crédential en lecture seule, distincte de la `DATABASE_URL` d'exécution.
secrets:
  database_url:
    environment: DATABASE_URL_BUILD
