name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eguidar
          POSTGRES_PASSWORD: eguidar
          POSTGRES_DB: eguidar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eguidar -d eguidar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.52
        env:
          MEILI_MASTER_KEY: eguidar-test-master-key
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -fsS http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://eguidar:eguidar@localhost:5432/eguidar_test
      MEILI_URL: http://localhost:7700
      MEILI_MASTER_KEY: eguidar-test-master-key
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eguidar
          POSTGRES_PASSWORD: eguidar
          POSTGRES_DB: eguidar_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eguidar -d eguidar_probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.52
        env:
          MEILI_MASTER_KEY: eguidar-test-master-key
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -fsS http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - run: npm ci
      - run: npx prisma generate
      # Le catalogue que le build prérendra : la base locale du job, migrée et
      # semée. Aucun secret de dépôt, la valeur reste éphémère (ADR-0020).
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://eguidar:eguidar@localhost:5432/eguidar_probe
      - run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://eguidar:eguidar@localhost:5432/eguidar_probe
          MEILI_URL: http://localhost:7700
          MEILI_MASTER_KEY: eguidar-test-master-key
          ADMIN_NAME: Administrateur
          ADMIN_EMAIL: admin@eguidar.com
          ADMIN_PASSWORD: change-me-admin-password
      - run: npm run build
        env:
          DATABASE_URL: postgresql://eguidar:eguidar@localhost:5432/eguidar_probe
          NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - run: docker compose --env-file .env.example config -q
        if: github.event_name == 'push' || github.event.pull_request.draft == false
      # Le driver `docker-container` ne résout pas `host-gateway` : le
      # constructeur partage donc l'espace réseau de l'hôte, et le `RUN` du
      # build joint le Catalogue du job sur `127.0.0.1:5432`.
      - uses: docker/setup-buildx-action@v4
        if: github.event_name == 'push' || github.event.pull_request.draft == false
        with:
          driver-opts: network=host
      - uses: docker/build-push-action@v7
        if: github.event_name == 'push' || github.event.pull_request.draft == false
        with:
          context: .
          target: runner
          tags: eguidar-runner:ci
          load: true
          build-args: |
            NEXT_PUBLIC_BETTER_AUTH_URL=http://localhost:3000
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
          # Le constructeur partage le réseau de l'hôte (voir l'étape
          # `setup-buildx`) : le build joint le service `postgres` sur son
          # adresse locale. La valeur voyage en secret BuildKit, pas en build
          # arg. Aucun secret de dépôt n'est lu.
          network: host
          allow: network.host
          secrets: |
            database_url=postgresql://eguidar:eguidar@127.0.0.1:5432/eguidar_probe
          # Seuls les pushes sur `main` écrivent le cache ; les itérations de
          # pull request ne font que le lire. Exporter `mode=max` à chaque
          # passage payait deux fois l'écriture d'un cache que seul `main`
          # fait grandir, alors que l'export est la moitié lente du build.
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      - uses: docker/build-push-action@v7
        if: github.event_name == 'push' || github.event.pull_request.draft == false
        with:
          context: .
          target: migrate
          tags: eguidar-migrate:ci
          load: true
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      # Le global setup de Vitest tronque la base de test : cette étape vient
      # donc après les constructions d'images, qui prérendent encore le
      # catalogue semé, et avant la sonde, qui remigre et resème la base. Le
      # `npx` laisse le fichier hors du registre des checks : le job `build`
      # garde sa seule porte nommée.
      - run: npx vitest run test/serveur-demarre-document-anonyme.test.ts
        env:
          DATABASE_URL: postgresql://eguidar:eguidar@localhost:5432/eguidar_probe
          TEST_DATABASE_URL: postgresql://eguidar:eguidar@localhost:5432/eguidar_probe
          TEST_DB_NAME: eguidar_probe
          BETTER_AUTH_SECRET: replace-with-a-long-random-secret
          # Ici l'artefact est obligatoire : sans lui, la sonde échoue au lieu
          # de se sauter, sinon la preuve de #761 ne prouverait rien.
          CATALOGUE_DE_BUILD_ATTENDU: "1"
      - run: bash scripts/verifier-image-deploiement.sh
        if: github.event_name == 'push' || github.event.pull_request.draft == false
        env:
          IMAGE_RUNNER: eguidar-runner:ci
          IMAGE_MIGRATE: eguidar-migrate:ci
          DATABASE_URL: postgresql://eguidar:eguidar@localhost:5432/eguidar_probe
          MEILI_URL: http://localhost:7700
          MEILI_MASTER_KEY: eguidar-test-master-key
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_URL: http://localhost:3100
          ADMIN_NAME: Administrateur
          ADMIN_EMAIL: admin@eguidar.com
          ADMIN_PASSWORD: change-me-admin-password
          BETTER_AUTH_SECRET: replace-with-a-long-random-secret
